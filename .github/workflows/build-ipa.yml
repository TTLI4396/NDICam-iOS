name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract NDI SDK for Apple
        run: |
          curl -fL --retry 3 -o /tmp/Install_NDI_SDK_v6_Apple.pkg \
            "https://downloads.ndi.tv/SDK/NDI_SDK_Mac/Install_NDI_SDK_v6_Apple.pkg"
          pkgutil --expand-full /tmp/Install_NDI_SDK_v6_Apple.pkg /tmp/ndi_sdk
          SDK_SRC="$(dirname "$(find /tmp/ndi_sdk -name 'libndi_ios.a' -path '*/lib/iOS/*' | head -1)")/../.."
          cp -R "$SDK_SRC" "$GITHUB_WORKSPACE/NDI SDK for Apple"
          ls -la "$GITHUB_WORKSPACE/NDI SDK for Apple/lib/iOS/"

      - name: Show toolchain
        run: |
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project NDICam.xcodeproj \
            -scheme NDICam \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/NDICam.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Ad-hoc sign (re-signing tool friendly)
        run: |
          APP="build/NDICam.xcarchive/Products/Applications/NDICam.app"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign -dv "$APP" 2>&1 | head -5

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/NDICam.xcarchive/Products/Applications/NDICam.app build/Payload/
          cd build && zip -qry NDICam.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NDICam-unsigned-ipa
          path: build/NDICam.ipa
